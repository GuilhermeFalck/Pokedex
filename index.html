<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Links -->
    <link
      rel="shortcut icon"
      href="./favicons/pokebola.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <!-- Main JS -->
    <script defer src="./js/main.js"></script>

    <title>Pokédex</title>
  </head>
  <body>
    <main>
      <img src="#" alt="pokemon" class="pokemon__image" />

      <h1 class="pokemon__data">
        <span class="pokemon__number"></span> -
        <span class="pokemon__name"></span>
      </h1>

      <form class="form">
        <input
          type="search"
          class="input__search"
          placeholder="Name or Number"
          required
        />
      </form>

      <div class="buttons">
        <button class="button btn-prev">&lt;</button>
        <button class="button btn-next">&gt;</button>
      </div>

      <div class="info">
        <h1>
          <span class="pokemonInfo">weight</span>:
          <span class="pokemon__weight"></span>
        </h1>
        <h1>
          <span class="pokemonInfo">height</span>:
          <span class="pokemon__height"></span>
        </h1>
      </div>

      <img src="./imgs/pokedex.png" alt="Pokedex" class="pokedex" />
    </main>
  </body>
</html>
